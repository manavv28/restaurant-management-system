name: BiteAI public release verification
on:
  push:
    branches: [deploy/biteai-mvp]
    paths-ignore: ['docs/**','README.md','.github/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Verify the deployed public origin with certificate validation enabled
        working-directory: frontend
        env:
          LIVE_BASE_URL: https://restaurant-management-system-qxtx.vercel.app
          EXPECTED_RELEASE: ${{ github.sha }}
        run: CHROMIUM_PATH=$(node -e "process.stdout.write(require('playwright').chromium.executablePath())") npx playwright test --config playwright.live.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-release-browser
          path: frontend/test-results/
          retention-days: 7
