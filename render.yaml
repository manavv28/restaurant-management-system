# Sample-data deployment. Review Render's current free-plan limits before launching.
services:
  - type: web
    name: biteai-demo
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Enter the Supabase session-pooler URL securely in Render.
      - key: DATABASE_URL
        sync: false
      - key: CATALOG_WORKER_ENABLED
        value: "true"
      - key: SEED_SAMPLE_DATA
        value: "true"
      - key: ENABLE_PAYMENT_SIMULATION
        value: "true"

# Retained only to protect the existing Render database during migration.
# Do not delete it until Supabase has been verified and existing data transferred.
databases:
  - name: biteai-demo-db
    plan: free
    region: singapore
    databaseName: biteai
    user: biteai
